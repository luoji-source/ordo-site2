name = "ordo-sales-site"
compatibility_date = "2026-01-15"
pages_build_output_dir = "dist"

[vars]
PUBLIC_SITE_NAME = "ORDO"

# Bindings are configured in Cloudflare Pages Dashboard (Settings → Bindings).
# Plan A: no R2. Media is served as static assets from /public/media.
#
# Optional: local development with Wrangler (uncomment and fill)
# [[d1_databases]]
# binding = "DB"
# database_name = "ordo_site_db"
# database_id = "<YOUR_D1_DATABASE_ID>"
#
# Optional: KV cache
# [[kv_namespaces]]
# binding = "CACHE"
# id = "<YOUR_KV_ID>"
