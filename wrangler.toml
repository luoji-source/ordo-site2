name = "ordo-sales-site"
compatibility_date = "2026-01-15"

[vars]
PUBLIC_SITE_NAME = "ORDO"

[[d1_databases]]
binding = "DB"
database_name = "ordo_site_db"
database_id = "REPLACE_WITH_YOUR_D1_ID"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "ordo-site-media"

